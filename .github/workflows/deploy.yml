name: Deploy Workflow
on:
  workflow_dispatch:
    inputs:
      name:
        type: string
        required: true
        description: The name
      surname:
        type: string
        required: false
        description: The surname
      environment:
        type: choice
        required: true
        description: The type
        default: dev
        options:
          - dev
          - uat
          - prod
jobs:
  ok:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello {{ inputs.name }} {{ inputs.surname }}"
      - run: echo "Deploy to {{ inputs.environment }}"
